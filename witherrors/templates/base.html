<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>MyBlog</title>
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
</head>

<body>
  <nav class="nav">
    <div class="container">
      <a href="{{ get_url(path='/') }}" class="{% if current_path == '/' %}active{% endif %}">Home</a>
      <a href="{{ get_url(path='about') }}" class="{% if current_path == '/about/' %}active{% endif %}">About Me</a>
      <a href="{{ get_url(path='posts') }}" class="{% if current_path is starting_with(pat='/posts/') %}active{% endif %}">Posts</a>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      {% block content %} {% endblock content %}
    </div>
  </section>
</body>

</html>
